<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Open Book Icon in Pure White -->
  <g transform="translate(14, 17)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left page -->
    <path d="M18 25V6C13.5 3 4.5 3 0 6V25C4.5 22 13.5 22 18 25Z" fill="rgba(255,255,255,0.1)"/>
    <!-- Right page -->
    <path d="M18 25V6C22.5 3 31.5 3 36 6V25C31.5 22 22.5 22 18 25Z" fill="rgba(255,255,255,0.1)"/>
  </g>

  <!-- AI Golden Sparkle Star -->
  <g transform="translate(42, 10)" filter="url(#glow)">
    <path d="M6 0L7.5 4.5L12 6L7.5 7.5L6 12L4.5 7.5L0 6L4.5 4.5Z" fill="#fbbf24"/>
  </g>
</svg>
